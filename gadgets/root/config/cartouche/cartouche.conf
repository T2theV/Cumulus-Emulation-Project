# Cartouche Linux - launch config
# Players per console, mapped to the emulators built into this image.
# Binary resolution: alias -> path dirs below -> system PATH.
# rehearsal = true makes Cartouche print the launch command instead of running it.

rehearsal = false
path = /sbin:/usr/local/bin:/usr/bin:/bin

# PlayStation 2 -> PCSX2
[ps2]
pcsx2 = pcsx2-qt {file.path}

# PlayStation 3 -> RPCS3
[ps3]
rpcs3 = rpcs3 {file.path}

# Dreamcast -> Flycast
[dreamcast]
flycast = flycast {file.path}

# Nintendo 64 -> Rosalies Mupen GUI (RMG); -n hides the GUI chrome, -q quits after emulation
[n64]
rmg = RMG -n -q {file.path}

# Xbox -> Xemu
[xbox]
xemu = xemu {file.path}

# Xbox 360 -> Xenia Edge
[xbox360]
xenia_edge = xenia_edge {file.path}

# GameCube / Wii -> Dolphin (forward; no GC/Wii ROMs in the library yet)
[gc]
dolphin = dolphin-emu {file.path}
[wii]
dolphin = dolphin-emu {file.path}
