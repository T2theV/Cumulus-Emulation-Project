[General]
profile=User
translation=
version=29

[User]
debug\dumpMode=0
font\color=@Variant(\0\0\0\43\1\xff\xff\xb5\xb5\xe6\xe6\1d\1d\0\0)
font\name=FreeSans.ttf
font\size=18

# Frame buffer emulation (not needed with Vulkan)
frameBufferEmulation\enable=0
frameBufferEmulation\aspect=1

# Texture settings
texture\anisotropy=1
texture\maxAnisotropy=16
texture\bilinearMode=1

# Texture filtering
textureFilter\txCacheCompression=1
textureFilter\txCacheSize=268435456
textureFilter\txFilterMode=0
textureFilter\txSaveCache=1

# Video settings - Vulkan with 1080p
video\deviceName=""
video\fullscreenHeight=1080
video\fullscreenRefresh=60
video\fullscreenWidth=1920
video\fxaa=0
video\maxMultiSampling=0
video\multisampling=0
video\threadedVideo=1
video\verticalSync=0
video\windowedHeight=1080
video\windowedWidth=1920

# OpenGL/Vulkan backend settings
# Vulkan is enabled through RMG GUI
# These settings apply to the GLideN64 video plugin
