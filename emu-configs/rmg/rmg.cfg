# RMG Configuration File
# Optimized for Vulkan with 1080p resolution and SDL inputs

[General]
# Backend selection
backend = vulkan
# Vulkan settings
vulkan.enable = true
vulkan.debug = false
vulkan.validation = false
vulkan.profile = vulkan1.2

# Resolution settings
resolution.scale = 1.0
resolution.internal = 1920x1080
resolution.aspect = force
fullscreen = false
windowed.width = 1920
windowed.height = 1080

[Graphics]
# Rendering backend
renderer = vulkan
# Anti-aliasing
antialiasing = none
# Anisotropic filtering
anisotropic_filter = 16x
# Texture filtering
texture_filter = linear
# Shader compilation
shader_precompilation = true
shader_cache = true
# Multithreading
multithreaded_rendering = true

[Performance]
# Frame limiting
frame_limit = 60
# VSync
vsync = true
# Async shader compilation
async_shader_compilation = true
# Hardware decoders
hardware_decoding = true

[Audio]
# Audio backend
audio_backend = openal
audio_device = default
audio_volume = 100
audio_sample_rate = 48000
audio_buffer_size = 1024

[Input]
# Controller configuration
# Using SDL for input mapping
input_backend = sdl
input.enable = true

# Primary controller
controller1.enable = true
controller1.type = gamepad
controller1.mapping = auto

# Controller mappings
# Button mapping
controller1.a = button_6
controller1.b = button_5
controller1.x = button_3
controller1.y = button_4
controller1.back = button_7
controller1.start = button_8
controller1.left_stick = axis_0_1
controller1.right_stick = axis_8_9
controller1.dpad_up = axis_2
controller1.dpad_down = axis_3
controller1.dpad_left = axis_10
controller1.dpad_right = axis_11

# Dead zones
controller1.deadzone_x = 0.1
controller1.deadzone_y = 0.1
controller1.deadzone_axis = 0.1

[Networking]
# Network settings
network.enable = true
network.host = 0.0.0.0
network.port = 8558

[Logging]
# Logging configuration
logging.enable = false
logging.level = info
logging.file = /var/log/rmg.log
