[Core]
# Mupen64Plus Core configuration
# Uses Vulkan through GLideN64 video plugin
# SDL for input handling

[Core]
Version = 1.010000
R4300Emulator = 2
NoCompiledJump = False
DisableExtraMem = False
CountPerOp = 0
CountPerOpDenomPot = 0
AutoStateSlotIncrement = False
CurrentStateSlot = 0
EnableDebugger = False
ScreenshotPath = "/config/.local/share/RMG/Screenshots"
SaveStatePath = "/config/.local/share/RMG/Save/State"
SaveSRAMPath = "/config/.local/share/RMG/Save/Game"
SharedDataPath = ""
RandomizeInterrupt = True
SiDmaDuration = -1
GbCameraVideoCaptureBackend1 = ""
SaveDiskFormat = 1
SaveFilenameFormat = 1

[Video-GLideN64]
# GLideN64 Vulkan renderer settings
# 1080p resolution scaling
Upscaling = 2
VSync = False
ScreenWidth = 1920
ScreenHeight = 1080
WidescreenStretch = False
DeinterlaceMode = False
SuperscaledReads = False
SuperscaledDither = True
CropOverscan = 0
VerticalStretch = 0
VIAA = True
Divot = True
GammaDither = True
VIBilerp = True
VIDither = True
DownScale = 0
NativeTextLOD = False
NativeTextRECT = True

[Rosalie's Mupen GUI - Input Plugin]
# SDL controller configuration
Profiles = ""
ControllerMode = 2

[Rosalie's Mupen GUI - Input Plugin Profile 0]
# Primary controller - SDL joystick
PluggedIn = True
DeviceName = "SDL Gamepad"
DeviceNum = 0
Deadzone = 9
Sensitivity = 100
Pak = 0
RemoveDuplicateMappings = True
FilterEventsForButtons = True
FilterEventsForAxis = True

# Button mappings (SDL joystick indices)
A_InputType = "0"
A_Name = "a"
A_Data = "0"
B_InputType = "0"
B_Name = "x"
B_Data = "2"
Start_InputType = "0"
Start_Name = "start"
Start_Data = "6"
DpadUp_InputType = "0"
DpadUp_Name = "dpup"
DpadUp_Data = "11"
DpadDown_InputType = "0"
DpadDown_Name = "dpdown"
DpadDown_Data = "12"
DpadLeft_InputType = "0"
DpadLeft_Name = "dpleft"
DpadLeft_Data = "13"
DpadRight_InputType = "0"
DpadRight_Name = "dpright"
DpadRight_Data = "14"
LeftTrigger_InputType = "0"
LeftTrigger_Name = "leftshoulder"
LeftTrigger_Data = "9"
RightTrigger_InputType = "0"
RightTrigger_Name = "rightshoulder"
RightTrigger_Data = "10"
ZTrigger_InputType = "0"
ZTrigger_Name = "ztrigger"
ZTrigger_Data = "8"

[Rosalie's Mupen GUI Core]
GFX_Plugin = "mupen64plus-video-GLideN64.so"
AUDIO_Plugin = "RMG-Audio.so"
INPUT_Plugin = "RMG-Input.so"
UserDataDirectory = "/config/.local/share/RMG"
UserCacheDirectory = "/config/.cache/RMG"
