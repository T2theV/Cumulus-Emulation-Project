# RPCS3 Vulkan Configuration
# Optimized for 1080p resolution

[Configuration]
vulkan.enable = true
vulkan.backend = VULKAN
vulkan.gpuarch = auto
vulkan.validation = false
vulkan.profile = 1.2

[Graphics]
resolution.scale = 1.0
resolution.internal = 1920x1080
resolution.auto = false
resolution.aspect = force
rendering.scale = 1.0
rendering.multithread = true
rendering.aa.msaa = 0
rendering.aa.fsaa = 0
rendering.anisotropic = 16
rendering.shadercache = true
rendering.texturecache = true
rendering.texturecache.compression = 8
rendering.async.shaders = true
rendering.raster = true
rendering.raster.multithread = true

[Performance]
gpu.vulkan.force = false
gpu.vulkan.force_64bit = false
gpu.vulkan.use_vulkan_memory_budget = true
gpu.vulkan.use_compute_shaders = true

[Audio]
audio.enable = true
audio.backend = openal
audio.volume = 100
audio.sample_rate = 48000
audio.buffer_size = 1024

[Input]
controller.enable = true
controller.type = SDL
controller.auto = true
controller.pad1.enable = true
controller.pad2.enable = false
controller.pad3.enable = false

[Logging]
logging.enable = false
logging.verbose = false
