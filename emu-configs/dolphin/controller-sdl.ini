[General]
# SDL Controller configuration for Dolphin
SDL_JoystickType = 0
SDL_JoystickNumber = 0
SDL_JoystickName = Auto

[Controller1]
# Gamepad 1 - Primary Controller
Type = Gamepad

[Controller1Inputs]
# Action Buttons
L = SDL_JoystickButton, 0
R = SDL_JoystickButton, 1
Z = SDL_JoystickButton, 2
X = SDL_JoystickButton, 3
Y = SDL_JoystickButton, 4
B = SDL_JoystickButton, 5
A = SDL_JoystickButton, 6

# Navigation
Left = SDL_JoystickAxis, 0, -1.0, 1.0
Right = SDL_JoystickAxis, 1, -1.0, 1.0
Up = SDL_JoystickAxis, 2, -1.0, 1.0
Down = SDL_JoystickAxis, 3, -1.0, 1.0

[Controller2]
# Gamepad 2 - Secondary Controller
Type = Gamepad

[Controller2Inputs]
# Action Buttons
L = SDL_JoystickButton, 0
R = SDL_JoystickButton, 1
Z = SDL_JoystickButton, 2
X = SDL_JoystickButton, 3
Y = SDL_JoystickButton, 4
B = SDL_JoystickButton, 5
A = SDL_JoystickButton, 6

# Navigation
Left = SDL_JoystickAxis, 0, -1.0, 1.0
Right = SDL_JoystickAxis, 1, -1.0, 1.0
Up = SDL_JoystickAxis, 2, -1.0, 1.0
Down = SDL_JoystickAxis, 3, -1.0, 1.0

[Audio]
# Audio settings
AudioDevice = Default
AudioBackend = OpenAL
AudioVolume = 1.0
AudioSampleRate = 48000
AudioBuffer = 0
AudioEnabled = true
