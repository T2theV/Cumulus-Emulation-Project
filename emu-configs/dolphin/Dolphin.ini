[Core]
Backend = Vulkan
Minify = true
FrameRateLimit = 60

[Graphics]
Backend = Vulkan
MultithreadedRendering = true
InternalResolution = 1920x1080
AnisotropicFiltering = 16x
TextureFiltering = Linear
ShaderCompiler = glslang
ForceShaderDiscard = false
ShaderPreCompilationCache = true
ForceD3D10ShaderCompiler = false
ForceD3D11ShaderCompiler = false
ForceSoftwareRendering = false
TextureCache = enabled
TextureCacheCompression = 8
VulkanValidationLayers = false
VulkanPresentQueue = immediate

[Input]
ControllerType = SDL
SDL = true
SDL_JoystickDirX = 1.0
SDL_JoystickDirY = -1.0
SDL_JoystickDirThreshold = 0.1
SDL_JoystickDeadZone = 0.1
SDL_JoystickAxisDeadZone = 0.1
SDL_JoystickHaptic = true
SDL_JoystickRumble = true
SDL_JoystickRumbleFade = true
SDL_JoystickRumbleFadeRate = 1.0
SDL_JoystickRumbleFadeMin = 0.0
SDL_JoystickRumbleFadeMax = 1.0

[Audio]
Backend = OpenAL
AudioBackend = OpenAL
AudioRate = 48000
AudioResample = true
AudioVolume = 1.0

[Display]
FullscreenMode = exclusive
FullscreenResolution = 1920x1080
WindowedResolution = 1920x1080
WindowedBorderless = false
