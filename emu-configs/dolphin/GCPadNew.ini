# Dolphin SDL Controller Configuration
# Maps SDL joystick inputs to Dolphin controller inputs

[GCPadNew]
# GameCube Controller (Primary)
Type = GamePad
SDL_JoystickType = 0
SDL_JoystickNumber = 0
SDL_JoystickName = Auto

[Mapping_GCPadNew]
# Button mappings for GameCube Controller
# SDL Button Index mappings:
#   0=Cross/+, 1=Circle/O, 2=Square/X, 3=Triangle/\
#   4=LS-Left, 5=LS-Right, 6=LS-Up, 7=LS-Down
#   8=RS-Left, 9=RS-Right, 10=RS-Up, 11=RS-Down
#   12=LB, 13=RB, 14=Start, 15=Back
#   16=L3, 17=R3
#   18=L2, 19=R2
#   20=LS-Left, 21=LS-Right, 22=LS-Up, 23=LS-Down
#   24=RS-Left, 25=RS-Right, 26=RS-Up, 27=RS-Down

# A Button (Triangle)
GCPadNew_A = SDL_JoystickButton, 3
GCPadNew_A_DeadZone = 0.1

# B Button (Circle)
GCPadNew_B = SDL_JoystickButton, 0
GCPadNew_B_DeadZone = 0.1

# X Button (Square)
GCPadNew_X = SDL_JoystickButton, 2
GCPadNew_X_DeadZone = 0.1

# Y Button (Cross)
GCPadNew_Y = SDL_JoystickButton, 1
GCPadNew_Y_DeadZone = 0.1

# Z Button (Z Trigger)
GCPadNew_Z = SDL_JoystickButton, 24
GCPadNew_Z_DeadZone = 0.1

# D-Pad
GCPadNew_DUp = SDL_JoystickAxis, 6, -0.5, 0.5
GCPadNew_DUp_DeadZone = 0.1
GCPadNew_DDown = SDL_JoystickAxis, 7, -0.5, 0.5
GCPadNew_DDown_DeadZone = 0.1
GCPadNew_DLeft = SDL_JoystickAxis, 4, -0.5, 0.5
GCPadNew_DLeft_DeadZone = 0.1
GCPadNew_DRight = SDL_JoystickAxis, 5, -0.5, 0.5
GCPadNew_DRight_DeadZone = 0.1

# Analog Stick (L Stick)
GCPadNew_LStick = SDL_JoystickAxis, 20, -1.0, 1.0
GCPadNew_LStick_DeadZone = 0.1

# Start
GCPadNew_Start = SDL_JoystickButton, 14
GCPadNew_Start_DeadZone = 0.1

# Back
GCPadNew_Back = SDL_JoystickButton, 15
GCPadNew_Back_DeadZone = 0.1

[GCKeyNew]
# Keyboard mappings (backup)
GCKeyNew_A = VK_RETURN
GCKeyNew_B = VK_OEM_8
GCKeyNew_X = VK_OEM_5
GCKeyNew_Y = VK_OEM_3
GCKeyNew_Start = VK_SPACE
GCKeyNew_Back = VK_BACK
